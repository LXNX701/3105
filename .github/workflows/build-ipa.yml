name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Listar proyectos y esquemas (debug)
        run: |
          echo "=== Proyectos encontrados ==="
          find . -name "*.xcodeproj" -type d
          echo "=== Workspaces encontrados ==="
          find . -name "*.xcworkspace" -type d
          echo "=== Esquemas disponibles ==="
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Compilar proyecto (usando workspace si existe)
        run: |
          if [ -f "ThreeOneOSFive.xcworkspace" ]; then
            echo "Usando workspace..."
            xcodebuild -workspace ThreeOneOSFive.xcworkspace \
              -scheme ThreeOneOSFive \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              GCC_OPTIMIZATION_LEVEL=s \
              OTHER_SWIFT_FLAGS="-O -whole-module-optimization" \
              build
          else
            echo "Usando proyecto..."
            xcodebuild -project ThreeOneOSFive.xcodeproj \
              -scheme ThreeOneOSFive \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              GCC_OPTIMIZATION_LEVEL=s \
              OTHER_SWIFT_FLAGS="-O -whole-module-optimization" \
              build
          fi

      - name: Crear carpeta Payload
        run: |
          mkdir -p Payload
          # Buscar el .app generado (puede estar en diferentes ubicaciones)
          if [ -d "build/Build/Products/Release-iphoneos/ThreeOneOSFive.app" ]; then
            cp -r build/Build/Products/Release-iphoneos/ThreeOneOSFive.app Payload/
          elif [ -d "build/Release-iphoneos/ThreeOneOSFive.app" ]; then
            cp -r build/Release-iphoneos/ThreeOneOSFive.app Payload/
          else
            echo "No se encontró el .app, buscando..."
            find build -name "*.app" -type d
            exit 1
          fi

      - name: Empaquetar IPA
        run: |
          zip -r MOONZAZA-X-CHEAT.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MOONZAZA-X-CHEAT
          path: MOONZAZA-X-CHEAT.ipa
