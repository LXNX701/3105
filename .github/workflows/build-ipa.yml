name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Listar proyectos y esquemas (debug)
        run: |
          echo "=== Proyectos encontrados ==="
          find . -name "*.xcodeproj" -type d
          echo "=== Workspaces encontrados ==="
          find . -name "*.xcworkspace" -type d
          echo "=== Esquemas disponibles ==="
          xcodebuild -list -project ThreeOneOSFive.xcodeproj || true

      - name: Compilar proyecto (usando workspace si existe)
        run: |
          if [ -d "ThreeOneOSFive.xcworkspace" ]; then
            echo "Usando workspace..."
            xcodebuild -workspace ThreeOneOSFive.xcworkspace \
              -scheme ThreeOneOSFive \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "Usando proyecto..."
            xcodebuild -project ThreeOneOSFive.xcodeproj \
              -scheme ThreeOneOSFive \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Crear carpeta Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "ThreeOneOSFive.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Archivo .app encontrado en: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          else
            echo "No se encontró el .app en las rutas estándar, listando contenido de build:"
            find build -maxdepth 4
            exit 1
          fi

      - name: Empaquetar IPA
        run: |
          zip -r MOONZAZA-X-CHEAT.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MOONZAZA-X-CHEAT
          path: MOONZAZA-X-CHEAT.ipa
