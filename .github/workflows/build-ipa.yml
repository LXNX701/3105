name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Compilar proyecto
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear carpeta Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "3105.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Archivo .app encontrado en: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          else
            echo "No se encontró el .app, listando contenido de build:"
            find build -maxdepth 4
            exit 1
          fi

      - name: Empaquetar IPA
        run: |
          zip -r MOONZAZA-X-CHEAT.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MOONZAZA-X-CHEAT
          path: MOONZAZA-X-CHEAT.ipa
