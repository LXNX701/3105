name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Listar proyectos y esquemas (debug)
        run: |
          echo "=== Proyectos encontrados ==="
          find . -name "*.xcodeproj" -type d
          echo "=== Workspaces encontrados ==="
          find . -name "*.xcworkspace" -type d
          echo "=== Esquemas disponibles (Project) ==="
          xcodebuild -list -project ThreeOneOSFive.xcodeproj || echo "No project found"
          echo "=== Esquemas disponibles (Workspace) ==="
          if [ -f "ThreeOneOSFive.xcworkspace" ]; then
            xcodebuild -list -workspace ThreeOneOSFive.xcworkspace || echo "No workspace found"
          fi

      - name: Extraer nombre del esquema
        id: scheme
        run: |
          if [ -f "ThreeOneOSFive.xcworkspace" ]; then
            SCHEME=$(xcodebuild -list -workspace ThreeOneOSFive.xcworkspace | grep "Schemes:" -A 10 | tail -1 | sed 's/^[[:space:]]*//g')
          else
            SCHEME=$(xcodebuild -list -project ThreeOneOSFive.xcodeproj | grep "Schemes:" -A 10 | tail -1 | sed 's/^[[:space:]]*//g')
          fi
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Detected scheme: $SCHEME"

      - name: Compilar proyecto (usando workspace si existe)
        run: |
          SCHEME="${{ steps.scheme.outputs.scheme }}"
          if [ -z "$SCHEME" ]; then
            echo "Error: Could not detect scheme name"
            exit 1
          fi
          
          if [ -f "ThreeOneOSFive.xcworkspace" ]; then
            echo "Usando workspace con esquema: $SCHEME"
            xcodebuild -workspace ThreeOneOSFive.xcworkspace \
              -scheme "$SCHEME" \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              GCC_OPTIMIZATION_LEVEL=s \
              OTHER_SWIFT_FLAGS="-O -whole-module-optimization" \
              build
          else
            echo "Usando proyecto con esquema: $SCHEME"
            xcodebuild -project ThreeOneOSFive.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              GCC_OPTIMIZATION_LEVEL=s \
              OTHER_SWIFT_FLAGS="-O -whole-module-optimization" \
              build
          fi

      - name: Crear carpeta Payload
        run: |
          mkdir -p Payload
          # Buscar el .app generado (puede estar en diferentes ubicaciones)
          if [ -d "build/Build/Products/Release-iphoneos/ThreeOneOSFive.app" ]; then
            cp -r build/Build/Products/Release-iphoneos/ThreeOneOSFive.app Payload/
          elif [ -d "build/Release-iphoneos/ThreeOneOSFive.app" ]; then
            cp -r build/Release-iphoneos/ThreeOneOSFive.app Payload/
          else
            echo "No se encontró el .app, buscando..."
            find build -name "*.app" -type d
            exit 1
          fi

      - name: Empaquetar IPA
        run: |
          zip -r MOONZAZA-X-CHEAT.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MOONZAZA-X-CHEAT
          path: MOONZAZA-X-CHEAT.ipa
